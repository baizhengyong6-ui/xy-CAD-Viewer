[package]
name = "xinyao-cad-viewer"
version = "0.3.0"
description = "Xinyao CAD Viewer (鑫垚CAD看图), GPL-3.0-only. Includes LibreDWG."
authors = ["Xinyao CAD"]
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.77.2"

[features]
default = []
# Enabled by `tauri build` so the release app loads embedded assets instead of the dev server.
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "xinyao_cad_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
url = "2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
