# Android release APK and AAB. The committed keystore is a public test key so
# the APK installs. Replace it with GitHub secrets before shipping to users.
# See README「Android 签名」.
name: Android installer

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install frontend dependencies
        run: npm ci

      - name: Sync the web core into the Android project
        run: npm run android:sync

      - name: Use a private release keystore when secrets are set
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret. Signing with android/xinyao-test.keystore."
          fi

      - name: Build release APK and AAB
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease

      - name: Name the release APK with the app version
        run: |
          ver=$(node -p "require('./package.json').version")
          mv android/app/build/outputs/apk/release/app-release.apk "android/app/build/outputs/apk/release/XinyaoCADViewer_${ver}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: XinyaoCADViewer-android
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          tag_name: ${{ github.ref_name }}
          name: 鑫垚CAD看图 ${{ github.ref_name }}
          body: |
            升级安装会清掉旧的桌面和开始菜单快捷方式，只保留当前这一套。
            安装时可以选择目录：NSIS 安装包有目录页，MSI 可以选择安装文件夹。升级时默认使用上次的目录。

            未签名安装包。Windows 为 NSIS（.exe）和 MSI，macOS 为 universal DMG，Android 为 APK。
            许可证：GPL-3.0-only（含 GNU LibreDWG）。
          files: android/app/build/outputs/apk/release/XinyaoCADViewer_*.apk
          fail_on_unmatched_files: true
