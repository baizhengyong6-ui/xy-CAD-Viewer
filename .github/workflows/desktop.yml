# GitHub-hosted runners only. This Linux agent cannot build a macOS DMG or a
# WiX MSI; those jobs run on macos-latest and windows-latest.
# Unsigned builds. macOS uses ad-hoc signing so Apple Silicon downloads are
# less likely to be marked damaged. Real Developer ID / Authenticode signing
# is documented in the README and is not configured here.
name: Desktop installers

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Check installer identity
        run: npx vitest run scripts/windows-installer.test.ts scripts/version.sync.test.ts

      # tagName is required. This tauri-action does not infer it from a tag push,
      # and without it the build succeeds but no Release assets are uploaded.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          tauriScript: npx tauri
          args: --bundles nsis,msi
          retryAttempts: 5
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "鑫垚CAD看图 v__VERSION__"
          releaseBody: |
            看图和测量可以用键盘。工具栏按钮上标出按键，右上角「快捷键」或按 ? 打开完整列表。
            Ctrl/⌘+O 打开，S 示例，R 最近文件。F 全图，+ 和 - 缩放，P 平移。
            D、A、N、L 分别测量距离、面积、角度、弧长，Shift+C 清除。
            Ctrl/⌘+E 导出 PNG，Ctrl/⌘+Shift+E 导出 PDF。
            F3 开关捕捉，按住 Shift 暂时关闭。Esc 取消当前测量或平移，并关闭面板。
            在输入框里打字，或命令行里已经有文字时，单键不会抢走输入。测量取点过程中仍可用 F、+、- 和 F3。

            未签名安装包。Windows 为 NSIS（.exe）和 MSI，macOS 为 universal DMG，Android 为 APK。
            许可证：GPL-3.0-only（含 GNU LibreDWG）。
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false

      - name: Verify install directory and upgrade shortcuts
        shell: pwsh
        timeout-minutes: 20
        run: ./scripts/windows-installer-smoke.ps1

      - name: Upload installer artifacts
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: XinyaoCADViewer-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      # tagName is required. This tauri-action does not infer it from a tag push,
      # and without it the build succeeds but no Release assets are uploaded.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ad-hoc signature. Replace with a Developer ID identity to notarize.
          APPLE_SIGNING_IDENTITY: "-"
        with:
          projectPath: .
          tauriScript: npx tauri
          args: --target universal-apple-darwin --bundles dmg
          retryAttempts: 5
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "鑫垚CAD看图 v__VERSION__"
          releaseBody: |
            看图和测量可以用键盘。工具栏按钮上标出按键，右上角「快捷键」或按 ? 打开完整列表。
            Ctrl/⌘+O 打开，S 示例，R 最近文件。F 全图，+ 和 - 缩放，P 平移。
            D、A、N、L 分别测量距离、面积、角度、弧长，Shift+C 清除。
            Ctrl/⌘+E 导出 PNG，Ctrl/⌘+Shift+E 导出 PDF。
            F3 开关捕捉，按住 Shift 暂时关闭。Esc 取消当前测量或平移，并关闭面板。
            在输入框里打字，或命令行里已经有文字时，单键不会抢走输入。测量取点过程中仍可用 F、+、- 和 F3。

            未签名安装包。Windows 为 NSIS（.exe）和 MSI，macOS 为 universal DMG，Android 为 APK。
            许可证：GPL-3.0-only（含 GNU LibreDWG）。
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false

      - name: Upload installer artifacts
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: XinyaoCADViewer-macos
          if-no-files-found: error
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
